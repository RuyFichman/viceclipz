services:
  studio:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
    volumes:
      - viceclipz-data:/app/data
    restart: unless-stopped
    stop_grace_period: 15s
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: [CMD, node, -e, "require('http').get({host:'127.0.0.1',port:4173,path:'/api/health',timeout:4000,headers:{host:new URL(process.env.APP_ORIGIN).host}},r=>{let b='';r.on('data',d=>b+=d).on('end',()=>{try{const h=JSON.parse(b);process.exit(h.worker&&h.automation?0:1)}catch{process.exit(1)}})}).on('error',()=>process.exit(1)).on('timeout',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
  proxy:
    image: caddy:2
    env_file: .env
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - studio
    restart: unless-stopped
volumes:
  viceclipz-data:
  caddy-data:
  caddy-config:
